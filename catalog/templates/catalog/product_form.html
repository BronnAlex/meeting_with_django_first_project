{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary">
                        {% if object %}
                            Готово
                        {% else %}
                            Создать
                        {% endif %}
                    </button>
                        {% if object %}
                            <a href="{% url 'catalog:product_delete' object.pk %}" class="btn btn-danger my-2">Удалить</a>
                        {% endif %}
                    <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary my-2">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock%}
